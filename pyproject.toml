[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-codex-control"
version = "0.3.2"
description = "Bridge a WeCom intelligent bot to ChatGPT Plus and local Codex tasks"
requires-python = ">=3.10,<3.14"
dependencies = [
  "playwright>=1.62,<2",
  "PyYAML>=6.0,<7",
  "websockets>=17.0,<18",
]

[project.scripts]
wechat-codex = "wechat_codex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
