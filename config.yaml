# 要监听的微信联系人或群名。默认用“文件传输助手”，方便直接从手机给自己发指令。
contact: "無惧"
# 当前监听对象类型。监听群聊时改为 group，并把 contact 改为群名。
chat_type: "friend"
# 使用外部 wx/wechat-cli 增量读取，不会为了轮询而打开或激活微信。
wechat_message_source: "wx_cli"
wx_cli_path: "wx"
# 同名联系人时填写 wx-cli 输出中的 username（wxid）；否则可以留空。
wx_cli_username: ""
# `read` 只输出这些精确名称的私聊和群聊。
wx_cli_contacts:
  - "無惧"
wx_cli_groups:
  - "ChatGPT"
wx_cli_timeout_seconds: 30
bot_name: "ChatGpt机器人"
authorized_senders:
  - "無惧"
background_mode: true

# 文件传输助手里的手机消息通常会被识别为自己发送，因此默认允许处理 self 消息。
# 程序自己的回复都带 response_prefix，会被自动忽略，不会形成循环。
allow_self_messages: false
voice_recognition: true
voice_retry_count: 3
response_prefix: "[Codex助手] "
send_ready_message: false
# 收到对方新消息后先立即确认，再继续 ChatGPT/Codex 处理。
send_received_ack: true
received_ack_text: "已收到，正在处理中，请稍等…"
poll_seconds: 1.0
max_reply_chars: 1800

chatgpt_browser_channel: "chrome"
chatgpt_headless: false
chatgpt_proxy_server: "socks5://127.0.0.1:7890"
chatgpt_conversation_title_prefix: "微信"
chat_timeout_seconds: 180

codex_command: "codex"
work_timeout_seconds: 3600

default_project: "control"
projects:
  control: "."
