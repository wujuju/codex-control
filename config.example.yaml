contact: "文件传输助手"
chat_type: "friend"
# uia：直接读取微信界面；wx_cli：调用外部 wx/wechat-cli 的 new-messages JSON。
wechat_message_source: "uia"
wx_cli_path: ""
wx_cli_username: ""
wx_cli_timeout_seconds: 30
bot_name: "ChatGpt机器人"
authorized_senders:
  - "無惧"
background_mode: true
allow_self_messages: true
voice_recognition: true
voice_retry_count: 3
response_prefix: "[Codex助手] "
send_ready_message: false
poll_seconds: 1.0
max_reply_chars: 1800

chatgpt_browser_channel: "chrome"
chatgpt_headless: false
# 留空时使用系统网络设置；Clash 等本地代理可填写 http://127.0.0.1:7890
chatgpt_proxy_server: ""
chat_timeout_seconds: 180

codex_command: "codex"
work_timeout_seconds: 3600

default_project: "control"
projects:
  control: "."
  # demo: "D:\\Sam\\demo"
