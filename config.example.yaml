# 微信 iLink Bot API。凭证由 ilink-login 写入 .runtime，不要放进 YAML。
ilink_api_base_url: "https://ilinkai.weixin.qq.com"
ilink_credentials_file: ".runtime/ilink-account.json"
ilink_state_file: ".runtime/ilink-state.json"
ilink_long_poll_timeout_seconds: 40

# 留空时只允许首次扫码授权的微信用户；需要增加用户时填写稳定的 ilink_user_id。
ilink_allowed_user_ids: []
ilink_codex_user_ids: []

response_prefix: "[Codex助手] "
send_received_ack: true
received_ack_text: "已收到，正在处理中，请稍等…"
poll_seconds: 0.5
max_reply_chars: 1800

chatgpt_browser_channel: "chrome"
# Windows 下使用隐藏的普通浏览器窗口，兼容 ChatGPT 登录态。
chatgpt_headless: true
# 留空时使用系统网络设置；例如 http://127.0.0.1:7890
chatgpt_proxy_server: ""
# ChatGPT 网页对话使用的完整固定标题。
chatgpt_conversation_title: "微信助手"
chat_timeout_seconds: 180

codex_command: "codex"
work_timeout_seconds: 3600

default_project: "control"
projects:
  control: "."
  # demo: "D:\\Sam\\demo"
